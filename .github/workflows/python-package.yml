name: Python manual install

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/python-package.yml'
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest optuna scikit-learn catboost xgboost lightgbm numpy

    - name: Run tests
      run: |
        pytest -v

  test-min-sklearn:
    # Guards the declared floor (scikit-learn>=1.1, Python>=3.9). Boosters are
    # intentionally not installed here, so their tests are skipped.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install minimum supported dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest "scikit-learn==1.1.*" "numpy<2" "optuna<4" scipy joblib
        pip install -e .

    - name: Run tests
      run: |
        pytest -v
