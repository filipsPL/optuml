name: Tests (source checkout, all extras)

on:
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/python-package.yml'
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package with all optional extras
      # Dependencies come from pyproject.toml, so every optional algorithm
      # (CatBoost, XGBoost, LightGBM, fuzzy-rough-learn, interpret, imodels) is tested.
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]" pytest

    - name: Run tests
      run: |
        pytest -v
