name: Tests (installed package)

on:
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/python-pip.yml'
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    # Installs the checkout as a regular (non-editable) package and runs the test
    # suite against the *installed* copy, which catches packaging mistakes such as
    # missing modules or undeclared dependencies.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package from checkout
      run: |
        python -m pip install --upgrade pip pytest
        pip install ".[all]"

    - name: Run tests against the installed package
      # importlib import mode does not put the repository root on sys.path, so
      # `import optuml` resolves to site-packages instead of the source folder.
      run: |
        pytest -v --import-mode=importlib
