[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optuml"
version = "0.2.7"
description = "Hyperparameter optimization for multiple machine learning algorithms using Optuna, with Scikit-learn API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Filip S.", email = "filip.ursynow@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # sklearn >= 1.1 is required: SGD loss "log_loss" only exists from 1.1 on.
    # The ensure_all_finite / force_all_finite and LogisticRegression penalty
    # shims keep the library working across 1.1 through >= 1.8.
    "optuna>=3.0.1",
    "scikit-learn>=1.1",
    "numpy",
    "scipy",
    "joblib",
]

[project.optional-dependencies]
catboost = ["catboost"]
xgboost = ["xgboost"]
lightgbm = ["lightgbm"]
frlearn = ["fuzzy-rough-learn"]
all = ["catboost", "xgboost", "lightgbm", "fuzzy-rough-learn"]

[project.urls]
Homepage = "https://github.com/filipsPL/optuml"

[tool.setuptools.packages.find]
include = ["optuml*"]
